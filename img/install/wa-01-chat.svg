<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 2400" font-family="Heebo, Segoe UI, Roboto, Arial, sans-serif" direction="rtl">
  <!-- Illustration of an APK received as a document in a chat app (not a screenshot). -->
  <rect width="1080" height="2400" fill="#0B141A"/>
  <!-- status bar -->
  <rect width="1080" height="110" fill="#1F2C34"/>
  <text x="1000" y="72" font-size="40" fill="#E9EDEF" text-anchor="end" direction="ltr">9:41</text>
  <!-- chat header -->
  <rect y="110" width="1080" height="170" fill="#1F2C34"/>
  <path d="M1030 195 l-34 -34 M1030 195 l-34 34 M1030 195 h-70" stroke="#E9EDEF" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="880" cy="195" r="52" fill="#6B7C85"/>
  <text x="880" y="214" font-size="52" fill="#0B141A" text-anchor="middle" font-weight="700">ד</text>
  <text x="800" y="185" font-size="46" fill="#E9EDEF" font-weight="700">דני</text>
  <text x="800" y="236" font-size="32" fill="#8696A0">מחובר/ת</text>
  <!-- date chip -->
  <rect x="440" y="340" width="200" height="60" rx="16" fill="#182229"/>
  <text x="540" y="381" font-size="30" fill="#8696A0" text-anchor="middle">היום</text>
  <!-- text message -->
  <rect x="300" y="450" width="720" height="140" rx="22" fill="#202C33"/>
  <text x="980" y="510" font-size="38" fill="#E9EDEF">הנה האפליקציה שדיברנו עליה 👇</text>
  <text x="340" y="565" font-size="26" fill="#8696A0" direction="ltr" text-anchor="start">19:02</text>
  <!-- document message -->
  <g>
    <rect x="300" y="620" width="720" height="290" rx="22" fill="#202C33"/>
    <rect x="320" y="640" width="680" height="170" rx="14" fill="#182229"/>
    <!-- file icon -->
    <rect x="880" y="660" width="96" height="124" rx="12" fill="#3DDC84"/>
    <path d="M948 660 v28 h28" fill="#2BB56A"/>
    <text x="928" y="745" font-size="30" fill="#0B141A" text-anchor="middle" font-weight="800" direction="ltr">APK</text>
    <text x="850" y="715" font-size="38" fill="#E9EDEF" font-weight="700" direction="ltr" text-anchor="end">JutsuNexus.apk</text>
    <text x="850" y="768" font-size="30" fill="#8696A0" direction="ltr" text-anchor="end">88 MB • APK</text>
    <!-- download button -->
    <circle cx="390" cy="725" r="50" fill="none" stroke="#8696A0" stroke-width="6"/>
    <path d="M390 695 v52 M368 727 l22 22 22 -22" stroke="#E9EDEF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="340" y="880" font-size="26" fill="#8696A0" direction="ltr" text-anchor="start">19:02</text>
  </g>
  <!-- tap hint -->
  <circle cx="928" cy="722" r="84" fill="#E0454A" fill-opacity="0.22" stroke="#E0454A" stroke-width="6"/>
  <circle cx="928" cy="722" r="16" fill="#E0454A"/>
  <rect x="330" y="960" width="660" height="110" rx="24" fill="#E0454A"/>
  <text x="660" y="1030" font-size="40" fill="#fff" text-anchor="middle" font-weight="700">מורידים ואז לוחצים על הקובץ</text>
  <!-- input bar -->
  <rect x="30" y="2190" width="860" height="120" rx="60" fill="#202C33"/>
  <text x="820" y="2263" font-size="38" fill="#8696A0">הודעה</text>
  <circle cx="975" cy="2250" r="62" fill="#00A884"/>
  <rect x="962" y="2215" width="26" height="46" rx="13" fill="#0B141A"/>
  <path d="M948 2248 a27 27 0 0 0 54 0 M975 2275 v14" stroke="#0B141A" stroke-width="6" fill="none" stroke-linecap="round"/>
</svg>
